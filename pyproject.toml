[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "plover-claude"
version = "2.4.0"
description = "Plover command plugin that opens and closes programs by name"
requires-python = ">=3.9"
dependencies = []

[project.entry-points."plover.command"]
LAUNCH = "launchers:launch"
CLOSE = "launchers:close"

[tool.setuptools]
py-modules = ["launchers"]
